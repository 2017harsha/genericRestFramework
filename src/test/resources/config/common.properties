# ---------------------------------------------------------------------------
# Settings shared by every environment. Env files override these.
# Any key can also be overridden with -Dkey=value or an env var (KEY_NAME).
# ---------------------------------------------------------------------------

# ---- Main API under test: Restful-Booker ----------------------------------
base.path=

# Token auth: POST {username,password} to auth.token.url, reuse the returned
# token for every request as the header  "Cookie: token=<token>"
auth.type=token
auth.token.url=/auth
auth.token.json.path=token
auth.username=admin
auth.header.name=Cookie
auth.header.prefix=token=

# ---- Secondary services (RequestSpecFactory.forService("<name>")) ---------
# Add one line per extra API the project tests, e.g.
# services.payments.base.url=https://payments.qa.example.com

# ---- HTTP ------------------------------------------------------------------
http.connect.timeout.ms=15000
http.read.timeout.ms=30000
http.relaxed.https=false

# all | failures | none   (sensitive headers are always masked)
log.mode=failures

# Response-time SLA used by tests (ms). Restful-Booker is a free Heroku app – be generous.
sla.response.ms=5000

aws.region=ap-south-1
