# ============================ PROD ==========================
base.url=https://restful-booker.herokuapp.com

# Prod password is NEVER stored in the repo or in Jenkins:
# it is read at runtime from AWS SSM Parameter Store (SecureString).
auth.password=ssm:/api-test-framework/prod/api-password
aws.region=ap-south-1

# Create/update/delete tests (@DestructiveTest) are skipped on prod by default.
tests.allow.destructive=false
log.mode=failures
